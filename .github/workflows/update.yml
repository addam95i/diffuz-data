name: Mise à jour des matchs

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Un seul passage à la fois (le robot est aussi lancé par Cloudflare toutes les 30 min).
concurrency:
  group: mise-a-jour-matchs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HAS_TSDB: ${{ secrets.THESPORTSDB_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les matchs et associer les chaînes
        run: node scripts/build.mjs
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - name: Version Dev (TheSportsDB, chaînes match par match)
        if: ${{ env.HAS_TSDB == 'true' }}
        continue-on-error: true
        run: node scripts/build-dev.mjs
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
      - name: Version Dev (autres sports, basket, MMA et boxe)
        if: ${{ env.HAS_TSDB == 'true' }}
        continue-on-error: true
        run: node scripts/build-sports.mjs
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
      - name: Publier le fichier pour l'appli
        run: |
          git config user.name "diffuz-bot"
          git config user.email "diffuz-bot@users.noreply.github.com"
          git add public/*.json
          git diff --cached --quiet || git commit -m "Mise à jour des matchs"
          git pull --rebase -X theirs origin main || true
          git push
