name: Mise à jour des matchs

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les matchs et associer les chaînes
        run: node scripts/build.mjs
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - name: Publier le fichier pour l'appli
        run: |
          git config user.name "diffuz-bot"
          git config user.email "diffuz-bot@users.noreply.github.com"
          git add public/matches.json
          git diff --cached --quiet || git commit -m "Mise à jour des matchs"
          git push
